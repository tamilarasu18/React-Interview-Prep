name: Improve an answer
description: An existing answer is wrong, outdated, or unclear
title: "[Answer]: "
labels: ["answer-improvement"]
body:
  - type: input
    id: question-id
    attributes:
      label: Question number
      description: The "#N" shown on the question page
      placeholder: "42"
    validations:
      required: true

  - type: dropdown
    id: problem
    attributes:
      label: What is wrong?
      options:
        - Factually incorrect
        - Outdated (superseded by a newer React version)
        - Unclear or confusing
        - Code example does not work
        - Short answer is too long or too vague
        - Memory hook does not help
        - Typo or formatting
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: Details
      description: What is wrong, and what should it say instead?
    validations:
      required: true

  - type: input
    id: source
    attributes:
      label: Source (optional)
      description: A link to documentation supporting the correction
